# Six-arm study (seed 42, 200 rollout batches of 16 x 8 on the fixed artifacts/sixarm prompts; full 566-batch schedule, resumable).
# Arm 2: REBEL on the scalar RM, no constraint (calibration file only records provenance; no dual).
base: ../rebel_common.yaml
arm: scalar
run_name: sixarm_arm2_rebel_scalar
artifacts_dir: artifacts/sixarm
max_rollout_batches: 200              # stop after 200 batches; the LR schedule still spans the full 566-batch epoch (never compressed)
checkpoint_at_batches: [100, 200]     # evaluated checkpoint = checkpoints/batch_00200 (rule after_batches:200); resume state continues to 566
scorer_rm_seed: 42
scorer_checkpoints:
  scalar: runs/rm_scalar_qwen2.5-1.5b_seed42/checkpoints/best
calibration_file: null                # unconstrained scalar arm on raw scores: nothing to calibrate
score_units: raw                      # raw reward / cost scores, no standardization
dual_rule: grpo_log_lambda            # GRPO's validated dual convention and hyperparameters (dual_learning_rate 0.01, cost_ema_decay 0.9, lambda_init 1)
checkpoint_every_batches: 0
