[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saferl-arms"
version = "0.1.0"
description = "Safe RL research arms. Arm 1: vanilla DPO on PKU-SafeRLHF helpfulness + harmlessness preferences."
requires-python = ">=3.9"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "hf: needs Hugging Face Hub access (tokenizer download)",
    "artifacts: needs generated artifacts/ from scripts/prepare_data.py",
    "slow: slow end-to-end checks (e.g. byte-identical data regeneration)",
]
addopts = "-q"
